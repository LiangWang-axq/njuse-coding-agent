[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "njuse-coding-agent"
version = "0.1.0"
description = "A framework-free command-line coding agent"
requires-python = ">=3.10"

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["coding_agent*"]
